concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}'
jobs:
  publish:
    name: 'Publish PS5 release'
    permissions:
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: '${{ github.token }}'
        name: 'Publish eboot.bin as the release in tag.txt'
        run: |
          # build.txt has the build's nine-character version, then the full source commit. The
          # updater matches the last nine characters of the tag to the running build's version.
          tag="$(head -n 1 tag.txt)"
          version="$(sed -n 1p build.txt)"
          commit="$(sed -n 2p build.txt)"
          if [[ "$tag" != *"$version" ]] || ! strings eboot.bin | grep -qx "$version"; then
            echo "eboot.bin is not build ${version}, or tag ${tag} does not end with it." >&2
            exit 1
          fi
          # The console installs a release only with this key's signature (host/ps5/update-sig.c).
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' \
            'MCowBQYDK2VwAyEAIapu1iWrYMbt3onNPZw6TLA/zE3ZqIGfxJQ7dpvoT1c=' \
            '-----END PUBLIC KEY-----' > "$RUNNER_TEMP/update.pub"
          openssl dgst -sha256 -binary eboot.bin > "$RUNNER_TEMP/eboot.sha256"
          if ! openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update.pub" -rawin \
            -in "$RUNNER_TEMP/eboot.sha256" -sigfile eboot.bin.sig; then
            echo "eboot.bin.sig is not the release key's signature of eboot.bin." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi
          gh release create "$tag" eboot.bin eboot.bin.sig --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$commit" --title "$(head -n 1 title.txt)"
name: 'PS5 release'
'on':
  push:
    branches:
      - 'ps5-builds'
